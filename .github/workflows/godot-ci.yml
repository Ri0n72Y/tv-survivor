name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run runtime test matrix
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            "scene|res://tests/test_runner.tscn"
            "scene|res://tests/ContentFoundationSmoke.tscn"
            "script|res://tests/rng_tests.gd"
          )

          failed=0
          for entry in "${tests[@]}"; do
            mode="${entry%%|*}"
            test="${entry#*|}"
            echo "=== RUN  $test ==="

            if [[ "$mode" == "script" ]]; then
              godot_args=(--headless --path . --script "$test")
            else
              godot_args=(--headless --path . "$test")
            fi

            if godot "${godot_args[@]}"; then
              echo "=== PASS $test ==="
            else
              rc=$?
              echo "=== FAIL $test (exit=$rc) ==="
              failed=1
            fi
          done

          exit "$failed"
